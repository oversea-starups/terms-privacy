<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Pulse — Legal & Support</title>
  <style>
    :root { color-scheme: light; --bg:#f7f7f4; --text:#202124; --muted:#626760; --line:#d9ddd2; --panel:#fff; --accent:#5b3ff2; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .wrap { width:min(720px,calc(100% - 32px)); margin:0 auto; padding:64px 0; }
    h1 { font-size:2.4rem; margin:0 0 8px; }
    p { color:var(--muted); margin:0 0 32px; }
    .cards { display:grid; gap:14px; }
    a.card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px 22px; text-decoration:none; color:var(--text); font-weight:700; }
    a.card span { display:block; color:var(--muted); font-weight:400; margin-top:4px; font-size:.95rem; }
    a.card:hover { border-color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI Pulse</h1>
    <p>AI News &amp; Perks · AI 热点与福利</p>
    <div class="cards">
      <a class="card" href="./privacy.html">Privacy Policy<span>隐私政策</span></a>
      <a class="card" href="./terms.html">Terms of Use<span>用户协议</span></a>
      <a class="card" href="./support.html">Support<span>支持与联系</span></a>
    </div>
  </div>
</body>
</html>
